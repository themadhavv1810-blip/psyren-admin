<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYREN Admin</title>
<style>
  :root { --blue:#1E6FD9; --orange:#FF8A1F; --bg:#F6F8FC; --text:#1B2433; --green:#1FA463; --red:#D93025; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--blue); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:20px; letter-spacing:3px; flex:1; }
  header button { background:#fff; color:var(--blue); border:0; border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; }
  nav { display:flex; gap:8px; padding:12px 20px; flex-wrap:wrap; }
  nav button { border:0; background:#fff; padding:10px 16px; border-radius:10px; cursor:pointer; font-weight:600; }
  nav button.active { background:var(--orange); color:#fff; }
  main { padding:0 20px 40px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .card .n { font-size:28px; font-weight:800; color:var(--blue); }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #eef1f6; font-size:14px; vertical-align:top; }
  th { background:#eef4ff; }
  .wrap { overflow-x:auto; }
  .btn { border:0; border-radius:8px; padding:6px 10px; cursor:pointer; font-weight:600; margin:2px; color:#fff; }
  .b-green { background:var(--green); } .b-red { background:var(--red); } .b-blue { background:var(--blue); } .b-grey { background:#7a8599; }
  .tag { padding:2px 8px; border-radius:20px; font-size:12px; font-weight:600; background:#eef4ff; color:var(--blue); }
  .tag.ok { background:#e3f6ec; color:var(--green); } .tag.bad { background:#fdeaea; color:var(--red); }
  #login { max-width:360px; margin:80px auto; background:#fff; padding:28px; border-radius:18px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  #login h2 { margin-top:0; color:var(--blue); }
  input, select { width:100%; padding:11px; margin:6px 0 12px; border:1px solid #d5dbe6; border-radius:10px; font-size:15px; }
  .primary { width:100%; background:var(--orange); color:#fff; border:0; padding:12px; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; }
  .err { color:var(--red); font-size:14px; min-height:18px; }
  .hidden { display:none; }
  .tools { display:flex; gap:10px; margin-bottom:12px; }
  .tools input, .tools select { margin:0; }
</style>
</head>
<body>

<div id="login">
  <h2>PSYREN Admin</h2>
  <label>Email</label>
  <input id="email" type="email" autocomplete="username">
  <label>Password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <button class="primary" id="loginBtn">Log in</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" class="hidden">
  <header>
    <h1>PSYREN ADMIN</h1>
    <span id="who"></span>
    <button id="logout">Log out</button>
  </header>
  <nav id="tabs">
    <button data-t="dash" class="active">Dashboard</button>
    <button data-t="workers">Workers</button>
    <button data-t="users">Users</button>
    <button data-t="bookings">Bookings</button>
    <button data-t="reports">Reports</button>
  </nav>
  <main id="view"></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, orderBy, query }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 1) PASTE YOUR FIREBASE WEB CONFIG HERE (Firebase Console > Project settings > Your apps > Web app)
const firebaseConfig = {
  apiKey: "AIzaSyDEpBM4bK8ifDhB76v2o_fABB-L2TWX3-k",
  authDomain: "psyren-app.firebaseapp.com",
  projectId: "psyren-app",
  storageBucket: "psyren-app.firebasestorage.app",
  messagingSenderId: "302246809630",
  appId: "1:302246809630:web:a016abf2e2bad56e275e0f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let tab = "dash";
let cache = {};

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
  } catch (e) { $("loginErr").textContent = e.message; }
};
$("logout").onclick = () => signOut(auth);

// Only users that have a document at admins/{uid} are allowed in.
onAuthStateChanged(auth, async (user) => {
  if (!user) { $("login").classList.remove("hidden"); $("app").classList.add("hidden"); return; }
  const a = await getDoc(doc(db, "admins", user.uid));
  if (!a.exists()) {
    $("loginErr").textContent = "This account is not an admin.";
    await signOut(auth);
    return;
  }
  $("who").textContent = user.email;
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  render();
});

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  tab = b.dataset.t;
  render();
});

async function load(name, order) {
  const ref = order ? query(collection(db, name), orderBy(order, "desc")) : collection(db, name);
  const snap = await getDocs(ref);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function render() {
  const v = $("view");
  v.innerHTML = "<p>Loading...</p>";
  try {
    if (tab === "dash") return renderDash(v);
    if (tab === "workers") return renderWorkers(v);
    if (tab === "users") return renderUsers(v);
    if (tab === "bookings") return renderBookings(v);
    if (tab === "reports") return renderReports(v);
  } catch (e) { v.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function renderDash(v) {
  const [users, workers, bookings, reports] = await Promise.all(
    ["users", "workers", "bookings", "reports"].map(n => load(n)));
  const open = reports.filter(r => r.status === "open").length;
  const done = bookings.filter(b => b.status === "completed").length;
  const verified = workers.filter(w => w.verified).length;
  v.innerHTML = `<div class="cards">
    <div class="card"><div class="n">${users.length}</div>Total users</div>
    <div class="card"><div class="n">${workers.length}</div>Workers</div>
    <div class="card"><div class="n">${verified}</div>NEEV Verified</div>
    <div class="card"><div class="n">${bookings.length}</div>Bookings</div>
    <div class="card"><div class="n">${done}</div>Completed</div>
    <div class="card"><div class="n" style="color:var(--orange)">${open}</div>Open reports</div>
  </div>`;
}

async function renderWorkers(v) {
  const rows = await load("workers");
  cache.workers = rows;
  v.innerHTML = `
    <div class="tools">
      <input id="q" placeholder="Search name / PIN / service">
      <select id="svc"><option value="">All services</option>
        ${["electrician","plumber","carpenter","painter","mason","cook","cleaner","tailor","driver","tutor"].map(s => `<option>${s}</option>`).join("")}
      </select>
    </div>
    <div class="wrap"><table><thead><tr>
      <th>Name</th><th>Service</th><th>PIN</th><th>Exp</th><th>Rating</th><th>Jobs</th><th>Status</th><th>Actions</th>
    </tr></thead><tbody id="wb"></tbody></table></div>`;
  const draw = () => {
    const q = $("q").value.toLowerCase(), s = $("svc").value;
    $("wb").innerHTML = rows
      .filter(w => (!s || w.service === s) &&
        (`${w.name} ${w.pin} ${w.service} ${w.phone}`.toLowerCase().includes(q)))
      .map(w => `<tr>
        <td>${esc(w.name)}<br><small>${esc(w.phone)}</small></td>
        <td>${esc(w.service)}</td><td>${esc(w.pin)}</td><td>${esc(w.experience)}</td>
        <td>${Number(w.rating || 0).toFixed(1)} (${w.ratingCount || 0})</td>
        <td>${w.completedJobs || 0}</td>
        <td>${w.verified ? '<span class="tag ok">Verified</span>' : '<span class="tag">Unverified</span>'}
            ${w.blocked ? '<span class="tag bad">Blocked</span>' : ''}</td>
        <td>
          <button class="btn ${w.verified ? "b-grey" : "b-green"}" data-act="verify" data-id="${w.id}">${w.verified ? "Remove NEEV" : "Give NEEV"}</button>
          <button class="btn ${w.blocked ? "b-blue" : "b-red"}" data-act="block" data-id="${w.id}">${w.blocked ? "Unblock" : "Block"}</button>
        </td></tr>`).join("");
  };
  draw();
  $("q").oninput = draw; $("svc").onchange = draw;
  $("wb").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const w = rows.find(x => x.id === b.dataset.id);
    if (b.dataset.act === "verify") {
      await updateDoc(doc(db, "workers", w.id), { verified: !w.verified });
    } else {
      await updateDoc(doc(db, "workers", w.id), { blocked: !w.blocked });
      await updateDoc(doc(db, "users", w.id), { blocked: !w.blocked });
    }
    render();
  };
}

async function renderUsers(v) {
  const rows = await load("users");
  v.innerHTML = `<div class="wrap"><table><thead><tr>
    <th>Name</th><th>Phone</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>${rows.map(u => `<tr>
      <td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td>${esc(u.role)}</td>
      <td>${u.blocked ? '<span class="tag bad">Blocked</span>' : '<span class="tag ok">Active</span>'}</td>
      <td><button class="btn ${u.blocked ? "b-blue" : "b-red"}" data-id="${u.id}" data-role="${u.role}" data-b="${u.blocked ? 1 : 0}">${u.blocked ? "Unblock" : "Block"}</button></td>
    </tr>`).join("")}</tbody></table></div>`;
  v.querySelector("tbody").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const next = b.dataset.b !== "1";
    await updateDoc(doc(db, "users", b.dataset.id), { blocked: next });
    if (b.dataset.role === "worker") {
      try { await updateDoc(doc(db, "workers", b.dataset.id), { blocked: next }); } catch (_) {}
    }
    render();
  };
}

async function renderBookings(v) {
  const rows = await load("bookings");
  rows.sort((a, b) => (b.date?.seconds || 0) - (a.date?.seconds || 0));
  v.innerHTML = `<div class="wrap"><table><thead><tr>
    <th>Date</th><th>Customer</th><th>Worker</th><th>Service</th><th>Address</th><th>Status</th></tr></thead>
    <tbody>${rows.map(b => `<tr>
      <td>${b.date ? new Date(b.date.seconds * 1000).toLocaleDateString("en-IN") : ""}</td>
      <td>${esc(b.customerName)}<br><small>${esc(b.customerPhone)}</small></td>
      <td>${esc(b.workerName)}</td><td>${esc(b.service)}</td><td>${esc(b.address)}</td>
      <td><span class="tag">${esc(b.status)}</span></td></tr>`).join("")}</tbody></table></div>`;
}

async function renderReports(v) {
  const rows = await load("reports");
  rows.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  v.innerHTML = `<div class="wrap"><table><thead><tr>
    <th>Date</th><th>Target (uid)</th><th>Message</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${r.createdAt ? new Date(r.createdAt.seconds * 1000).toLocaleDateString("en-IN") : ""}</td>
      <td><small>${esc(r.targetId)}</small></td><td>${esc(r.message)}</td>
      <td><span class="tag ${r.status === "open" ? "bad" : "ok"}">${esc(r.status)}</span></td>
      <td>
        ${r.status === "open" ? `<button class="btn b-green" data-a="resolve" data-id="${r.id}">Resolve</button>` : ""}
        <button class="btn b-red" data-a="block" data-id="${r.id}" data-t="${esc(r.targetId)}">Block target</button>
      </td></tr>`).join("")}</tbody></table></div>`;
  v.querySelector("tbody").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.a === "resolve") {
      await updateDoc(doc(db, "reports", b.dataset.id), { status: "resolved" });
    } else if (confirm("Block this account?")) {
      await updateDoc(doc(db, "users", b.dataset.t), { blocked: true });
      try { await updateDoc(doc(db, "workers", b.dataset.t), { blocked: true }); } catch (_) {}
      await updateDoc(doc(db, "reports", b.dataset.id), { status: "resolved" });
    }
    render();
  };
}
</script>
</body>
</html>
